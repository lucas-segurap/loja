
<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Gerenciamento de Produtos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #1e293b;
        }

        .container {
            max-width: 1150px;
        }

        .card-principal {
            background: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
            padding: 30px;
        }

        .titulo {
            font-weight: 700;
            color: #0f172a;
            border-bottom: 3px solid #2563eb;
            padding-bottom: 15px;
        }

        .btn-novo {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-novo:hover {
            background: #1d4ed8;
            color: white;
            transform: translateY(-2px);
        }

        .tabela-produtos {
            overflow: hidden;
            border-radius: 10px;
        }

        .tabela-produtos thead {
            background: #172554;
            color: white;
        }

        .tabela-produtos th {
            padding: 15px;
            font-weight: 600;
        }

        .tabela-produtos td {
            padding: 13px 15px;
            vertical-align: middle;
        }

        .tabela-produtos tbody tr:hover {
            background: #eff6ff;
        }

        .btn-editar {
            background: #f59e0b;
            color: #ffffff;
            border: none;
        }

        .btn-editar:hover {
            background: #d97706;
            color: #ffffff;
        }

        .btn-excluir {
            background: #dc2626;
            color: #ffffff;
            border: none;
        }

        .btn-excluir:hover {
            background: #b91c1c;
            color: #ffffff;
        }

        .alert {
            border-radius: 9px;
        }

        .mensagem-vazia {
            padding: 35px;
            color: #64748b;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .card-principal {
                padding: 18px;
            }

            .titulo {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card-principal">

        <h1 class="titulo mb-4">
            🛒 Gerenciamento de Produtos
        </h1>

        <div th:if="${mensagem}"
             class="alert alert-success alert-dismissible fade show"
             role="alert">

            <span th:text="${mensagem}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Fechar">
            </button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">

            <p class="text-muted mb-0">
                Gerencie os produtos cadastrados na loja.
            </p>

            <a th:href="@{/produtos/novo}"
               class="btn btn-novo">
                + Novo Produto
            </a>

        </div>

        <div class="table-responsive tabela-produtos">

            <table class="table table-bordered table-striped table-hover mb-0">

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="produto : ${produtos}">

                    <td th:text="${produto.id}"></td>

                    <td th:text="${produto.nome}"></td>

                    <td th:text="${#numbers.formatCurrency(produto.preco)}"></td>

                    <td th:text="${produto.quantidade}"></td>

                    <td class="text-center">

                        <a th:href="@{/produtos/editar/{id}(id=${produto.id})}"
                           class="btn btn-editar btn-sm me-1">
                            ✏️ Editar
                        </a>

                        <form th:action="@{/produtos/excluir/{id}(id=${produto.id})}"
                              method="post"
                              class="d-inline">

                            <button type="submit"
                                    class="btn btn-excluir btn-sm"
                                    onclick="return confirm('Deseja realmente excluir este produto?')">
                                🗑 Excluir
                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(produtos)}">

                    <td colspan="5"
                        class="text-center mensagem-vazia">

                        📦 Nenhum produto cadastrado.

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <footer class="text-center text-muted mt-4">
        <small>Sistema de Gerenciamento de Produtos</small>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
