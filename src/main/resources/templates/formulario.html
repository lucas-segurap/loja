
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Cadastro de Produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">Cadastro de Produto</h1>

    <form th:action="@{/produtos/salvar}"
          th:object="${produto}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>

            <input type="text"
                   th:field="*{nome}"
                   class="form-control"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('nome')}"
                 th:errors="*{nome}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>

            <textarea th:field="*{descricao}"
                      class="form-control"
                      rows="3">
            </textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Preço</label>

            <input type="number"
                   step="0.01"
                   th:field="*{preco}"
                   class="form-control"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('preco')}"
                 th:errors="*{preco}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade</label>

            <input type="number"
                   th:field="*{quantidade}"
                   class="form-control"
                   required>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('quantidade')}"
                 th:errors="*{quantidade}">
            </div>
        </div>

        <button type="submit" class="btn btn-success">
            Salvar
        </button>

        <a th:href="@{/produtos}" class="btn btn-secondary">
            Voltar
        </a>

    </form>

</div>

</body>
</html>
